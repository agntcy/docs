name: Documentation

on:
  workflow_call:
    inputs:
      deploy:
        description: "Deploy documentation artifacts"
        required: true
        type: boolean
        default: false
      version:
        description: "Version to use for documentation artifacts"
        required: true
        type: string
        default: dev

  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy documentation artifacts"
        required: true
        type: boolean
        default: false
      version:
        description: "Version to use for documentation artifacts"
        required: true
        type: string
        default: dev

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Setup Golang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.3"

      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: "3.48.0"

      - name: Setup UV
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Update GITHUB_PATH
        shell: bash
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build docs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          task build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: docs-website
          path: ./.build/site

  deploy:
    name: Deploy artifacts
    if: ${{ inputs.deploy == true || inputs.deploy == 'true' }}
    needs:
      - build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: docs-website
